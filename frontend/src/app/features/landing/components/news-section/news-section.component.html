<section class="news-section" aria-labelledby="news-title">
  <div class="section-divider" aria-hidden="true"><span></span></div>
  <div class="section-heading" data-reveal>
    <span class="eyebrow"
      ><i class="pi pi-megaphone" aria-hidden="true"></i>{{ 'LANDING.NEWS_EYEBROW' | translate }}</span
    >
    <h2 id="news-title">{{ 'LANDING.NEWS_TITLE' | translate }}</h2>
    <p>{{ 'LANDING.NEWS_DESCRIPTION' | translate }}</p>
  </div>
  <app-achievements-showcase view="news" data-reveal style="--reveal-delay: 120ms" />
</section>
