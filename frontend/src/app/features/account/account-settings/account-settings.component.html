<div class="p-6 max-w-2xl mx-auto mt-8 bg-white rounded-xl shadow">
  <h2 class="text-2xl font-bold text-gray-800 mb-6">{{ 'ACCOUNT.TITLE' | translate }}</h2>
  
  <div class="mb-8">
    <label class="block text-sm font-semibold text-gray-700 mb-2">{{ 'ACCOUNT.SIGNATURE.LABEL' | translate }}</label>
    <p class="text-sm text-gray-500 mb-4">{{ 'ACCOUNT.SIGNATURE.DESCRIPTION' | translate }}</p>
    
    <div class="border-2 border-dashed border-gray-300 rounded-lg p-2 bg-gray-50 flex flex-col items-center">
      <canvas #signaturePad class="bg-white border border-gray-200 rounded w-[400px] h-[200px]" width="400" height="200" style="touch-action: none;"></canvas>
      
      <div class="mt-4 flex gap-4">
        <button type="button" (click)="clearSignature()" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50">
          {{ 'ACCOUNT.SIGNATURE.CLEAR' | translate }}
        </button>
      </div>
    </div>
  </div>

  <div class="flex justify-end pt-4 border-t border-gray-200">
    <button type="button" (click)="saveSignature()" [disabled]="isSaving"
            class="px-6 py-2 bg-[#0F7132] text-white font-medium rounded-lg hover:bg-[#15603D] disabled:opacity-50">
      {{ 'COMMON.SAVE' | translate }}
    </button>
  </div>
</div>
