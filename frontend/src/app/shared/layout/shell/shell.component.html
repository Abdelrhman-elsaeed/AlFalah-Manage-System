<div class="shell" dir="rtl">
  <header class="shell-topbar">
    <!-- Right Section: Framed User Profile + Saudi Digital Clock -->
    <div class="shell-topbar__right-group">
      <!-- Framed User Profile Card -->
      <div class="shell-topbar__profile-card" *ngIf="currentUser() as user">
        <div class="shell-topbar__avatar-container">
          <span class="shell-topbar__avatar" aria-hidden="true">
            <img src="assets/Logo.png" alt="شعار مدارس الفلاح" />
          </span>
          <span class="shell-topbar__status-indicator" title="متصل"></span>
        </div>

        <div class="shell-topbar__user-details">
          <span class="shell-topbar__user-name">{{ user.fullName }}</span>
          <div class="shell-topbar__role-container">
            <span class="shell-topbar__user-role" *ngIf="primaryRoleKey() as role">
              <i class="pi pi-shield" aria-hidden="true"></i>
              <span>{{ role | roleDisplayName }}</span>
            </span>
          </div>
        </div>
      </div>

      <!-- Saudi Digital Clock (Beside Profile/Logo) -->
      <div
        class="shell-topbar__clock-badge"
        [pTooltip]="'توقيت المملكة العربية السعودية (مكة المكرمة)'"
        tooltipPosition="bottom"
        tooltipAppendTo="body">
        <i class="pi pi-clock"></i>
        <span class="shell-topbar__clock-time">{{ ksaTime() }}</span>
      </div>
    </div>

    <!-- Center School Name (Middle) -->
    <div class="shell-topbar__center-school">
      <div class="shell-topbar__school-box">
        <div class="shell-topbar__school-icon-wrapper">
          <i class="pi pi-building"></i>
        </div>
        <span class="shell-topbar__school-title" *ngIf="activeSchoolName() as school; else generalAppName">
          {{ school }}
        </span>
        <ng-template #generalAppName>
          <span class="shell-topbar__school-title">{{ 'APP.NAME' | translate }}</span>
        </ng-template>
      </div>
    </div>

    <!-- Left Section: Logout Button -->
    <div class="shell-topbar__actions">
      <button
        type="button"
        class="shell-topbar__logout"
        (click)="logout()"
        [pTooltip]="'AUTH.LOGOUT' | translate"
        tooltipPosition="bottom"
        tooltipAppendTo="body"
        [attr.aria-label]="'AUTH.LOGOUT' | translate">
        <i class="pi pi-sign-out"></i>
        <span class="shell-topbar__logout-label">{{ 'AUTH.LOGOUT' | translate }}</span>
      </button>
    </div>
  </header>

  <div class="shell-body" [class.is-sidebar-collapsed]="isSidebarCollapsed()">
    <aside class="shell-sidebar" [class.is-collapsed]="isSidebarCollapsed()">
      <div class="shell-sidebar__controls">
        <span class="shell-sidebar__menu-title">
          <i class="pi pi-th-large" aria-hidden="true"></i>
          <span>{{ 'NAV.MENU' | translate }}</span>
        </span>

        <button
          type="button"
          class="shell-sidebar__collapse-button"
          (click)="toggleSidebar()"
          [pTooltip]="(isSidebarCollapsed() ? 'NAV.EXPAND_SIDEBAR' : 'NAV.COLLAPSE_SIDEBAR') | translate"
          tooltipPosition="left"
          tooltipAppendTo="body"
          [attr.aria-expanded]="!isSidebarCollapsed()"
          [attr.aria-label]="(isSidebarCollapsed() ? 'NAV.EXPAND_SIDEBAR' : 'NAV.COLLAPSE_SIDEBAR') | translate">
          <i
            class="pi"
            [class.pi-angle-double-left]="isSidebarCollapsed()"
            [class.pi-angle-double-right]="!isSidebarCollapsed()"
            aria-hidden="true"></i>
        </button>
      </div>

      <nav [attr.aria-label]="'NAV.MAIN_NAVIGATION' | translate">
        <ul class="shell-sidebar__list shell-sidebar__list--top">
          <li *ngFor="let item of topItems()">
            <a
              [routerLink]="item.route"
              routerLinkActive="is-active"
              class="shell-sidebar__link"
              [pTooltip]="(item.tooltipKey || item.labelKey) | translate"
              tooltipPosition="left">
              <i [class]="item.icon" class="shell-sidebar__icon"></i>
              <span class="shell-sidebar__label">{{ item.labelKey | translate }}</span>
            </a>
          </li>
        </ul>

        <div
          *ngFor="let category of visibleCategories()"
          class="shell-sidebar__category"
          [class.is-active-category]="categoryContainsActiveRoute(category)">
          <button
            type="button"
            class="shell-sidebar__category-toggle"
            [class.is-expanded]="isCategoryExpanded(category)"
            [attr.aria-expanded]="isCategoryExpanded(category)"
            [attr.aria-controls]="'sidebar-category-' + category.id"
            [pTooltip]="category.labelKey | translate"
            tooltipPosition="left"
            (click)="toggleCategory(category)">
            <span class="shell-sidebar__category-title">
              <i [class]="category.icon" class="shell-sidebar__category-icon"></i>
              <span class="shell-sidebar__category-label">{{ category.labelKey | translate }}</span>
            </span>
            <i class="pi pi-angle-down shell-sidebar__category-chevron" aria-hidden="true"></i>
          </button>

          <ul
            *ngIf="isCategoryExpanded(category)"
            class="shell-sidebar__list shell-sidebar__list--nested"
            [id]="'sidebar-category-' + category.id">
            <li *ngFor="let item of category.items">
              <a
                [routerLink]="item.route"
                routerLinkActive="is-active"
                [routerLinkActiveOptions]="item.exact ? exactMatchOptions : prefixMatchOptions"
                class="shell-sidebar__link shell-sidebar__link--nested"
                [pTooltip]="(item.tooltipKey || item.labelKey) | translate"
                tooltipPosition="left">
                <i [class]="item.icon" class="shell-sidebar__icon"></i>
                <span class="shell-sidebar__label">{{ item.labelKey | translate }}</span>
              </a>
            </li>
          </ul>
        </div>
      </nav>
    </aside>

    <main class="shell-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
